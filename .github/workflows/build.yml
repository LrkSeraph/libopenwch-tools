# Build and test libopenwch-tools.
#
# Unlike libopenwch, this repository needs libusb to build, so the dependency
# is installed here.  The tests need no hardware: besides the chip table and
# the command-line contract, `flash_test` drives a whole flash sequence through
# a simulated programmer and a simulated CH32V003 -- protocol framing, debug
# module, flash controller and all.  Hardware is the one thing CI cannot
# supply, and it is the one thing left unproven.

name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: host build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Report the toolchain
        run: |
          cc --version | head -1
          pkg-config --modversion libusb-1.0

      # A developer's absolute path in a committed file is a small leak that is
      # invisible in code review, and these repositories are public.  Cheap to
      # check here; expensive to discover later in the history.
      - name: No local paths or credentials in tracked files
        run: |
          fail=0
          if git grep -n -I -E '/home/[a-z]+/|/Users/[A-Za-z]+/|C:\\Users' -- . ; then
            echo "::error::a tracked file contains an absolute path from a developer's machine"
            fail=1
          fi
          if git grep -n -I -E 'PRIVATE KEY-----|password[[:space:]]*=|api[_-]?key[[:space:]]*=|ghp_[A-Za-z0-9]{20,}|github_pat_' -- . ; then
            echo "::error::a tracked file looks like it contains a credential"
            fail=1
          fi
          if [ "$fail" != 0 ]; then exit 1; fi
          echo "no local paths or credentials in tracked files"

      - name: Build
        run: make

      - name: Test
        run: make test

      # The protocol, debug-module and flash tests deliberately do not link
      # libusb: `make -C tests` builds them on a machine that has never seen a
      # USB stack, which is what keeps the seam between the two real.
      - name: Tests without libusb
        run: |
          make -C tests clean
          make -C tests build/target_test build/flash_test
          ./tests/build/target_test
          ./tests/build/flash_test

      # Guards the "-dev package missing" path: the build must also work with
      # libusb supplied by hand, which is how it is built on a machine that
      # only has the runtime library.
      - name: Build with libusb supplied by hand
        run: |
          make clean
          make LIBUSB_CFLAGS="$(pkg-config --cflags libusb-1.0)" \
               LIBUSB_LIBS="$(pkg-config --libs libusb-1.0)"

      - name: Check the CLI is sane with no hardware
        run: |
          ./build/wchlink --version
          ./build/wchlink chips | head -3
          # No programmer here, so this must be exit 3 and must not crash.
          ./build/wchlink info || test $? -eq 3
